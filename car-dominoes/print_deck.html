<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Dominoes: Traffic Slam! - Print-and-Play Deck (36 Cards)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap');
    
    @page {
      size: letter portrait;
      margin: 0.35in;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    /* 3x3 Grid of Wide Domino Poker Cards (3.5in wide x 2.4in tall) */
    .sheet {
      display: grid;
      grid-template-columns: repeat(2, 3.5in);
      grid-template-rows: repeat(4, 2.4in);
      gap: 0.08in;
      page-break-after: always;
      justify-content: center;
      margin-bottom: 0.5in;
    }

    .card {
      width: 3.5in;
      height: 2.4in;
      box-sizing: border-box;
      border: 1px dashed #64748b;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      background: white;
      position: relative;
    }

    .font-cartoon {
      font-family: 'Fredoka One', cursive;
    }

    @media print {
      body {
        background: white;
      }
      .no-print {
        display: none !important;
      }
      .sheet {
        margin-bottom: 0;
        gap: 0;
      }
      .card {
        border: 1px solid #334155;
      }
    }
  </style>
</head>
<body class="p-6">

  <!-- TOP PRINT INSTRUCTIONS -->
  <div class="no-print max-w-3xl mx-auto mb-6 p-4 bg-white rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
    <div>
      <h1 class="text-xl font-cartoon text-red-600">CAR DOMINOES: PRINT-AND-PLAY DECK</h1>
      <p class="text-xs text-slate-500 font-bold mt-0.5">36 Cards • 1 Whole Car Per Card • Illustrated Edition (Ages 5+)</p>
    </div>
    <div class="flex gap-2">
      <a href="prototype.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition">
        &larr; Web Prototype
      </a>
      <button onclick="window.print()" class="px-5 py-2 bg-red-600 hover:bg-red-500 text-white font-cartoon text-xs rounded-xl shadow transition">
        🖨️ Print Cards (Ctrl+P)
      </button>
    </div>
  </div>

  <div id="sheets-container" class="flex flex-col items-center">
    <!-- Rendered Sheets -->
  </div>

  <script>
    const CarArtEngine = {
      getColorHex(color) {
        if (color === 'red') return '#dc2626';
        if (color === 'blue') return '#2563eb';
        if (color === 'yellow') return '#f59e0b';
        if (color === 'green') return '#16a34a';
        if (color === 'orange') return '#ea580c';
        if (color === 'wild') return '#8b5cf6';
        return '#475569';
      },

      wheel(cx, cy, r = 17, isMonster = false) {
        if (isMonster) {
          return `
            <circle cx="${cx}" cy="${cy}" r="${r+5}" fill="#09090b" stroke="#27272a" stroke-width="3"/>
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="#18181b" stroke="#71717a" stroke-width="3"/>
            <circle cx="${cx}" cy="${cy}" r="7" fill="#e4e4e7"/>
          `;
        }
        return `
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="#0f172a" stroke="#334155" stroke-width="3"/>
          <circle cx="${cx}" cy="${cy}" r="${r-6}" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
          <circle cx="${cx}" cy="${cy}" r="3.5" fill="#475569"/>
        `;
      },

      renderFullCardSvg(card) {
        const h1 = card.half1;
        const h2 = card.half2;
        const c1Hex = this.getColorHex(h1.color);
        const c2Hex = this.getColorHex(h2.color);

        const rearSvg = this.getRearHalfSvg(h1.vehicle);
        const frontSvg = this.getFrontHalfSvg(h2.vehicle);

        return `
          <svg viewBox="0 0 240 120" class="w-full h-full" preserveAspectRatio="none">
            <rect x="0" y="0" width="120" height="120" fill="${c1Hex}"/>
            <rect x="120" y="0" width="120" height="120" fill="${c2Hex}"/>
            <line x1="120" y1="0" x2="120" y2="120" stroke="#000000" stroke-width="2.5" stroke-dasharray="5,4" opacity="0.4"/>
            <rect x="0" y="96" width="240" height="24" fill="#0f172a"/>
            <line x1="10" y1="108" x2="230" y2="108" stroke="#facc15" stroke-dasharray="14,10" stroke-width="2.5"/>
            <g transform="translate(0, 0)">${rearSvg}</g>
            <g transform="translate(120, 0)">${frontSvg}</g>
            <text x="8" y="16" font-family="'Fredoka One', cursive" font-size="10" fill="#ffffff" opacity="0.9" filter="drop-shadow(0 1px 1px rgba(0,0,0,0.8))">
              ${h1.vehicle.toUpperCase()}
            </text>
            <text x="232" y="16" font-family="'Fredoka One', cursive" font-size="10" fill="#ffffff" opacity="0.9" text-anchor="end" filter="drop-shadow(0 1px 1px rgba(0,0,0,0.8))">
              ${h2.vehicle.toUpperCase()}
            </text>
          </svg>
        `;
      },

      getRearHalfSvg(vehicle) {
        if (vehicle === 'Fire Truck') {
          return `
            <rect x="15" y="36" width="105" height="56" rx="4" fill="#991b1b" stroke="#7f1d1d" stroke-width="2"/>
            <rect x="25" y="44" width="46" height="38" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
            <line x1="25" y1="52" x2="71" y2="52" stroke="#64748b" stroke-width="2"/>
            <line x1="25" y1="62" x2="71" y2="62" stroke="#64748b" stroke-width="2"/>
            <line x1="25" y1="72" x2="71" y2="72" stroke="#64748b" stroke-width="2"/>
            <rect x="10" y="20" width="110" height="14" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
            <line x1="26" y1="20" x2="26" y2="34" stroke="#475569" stroke-width="2.5"/>
            <line x1="46" y1="20" x2="46" y2="34" stroke="#475569" stroke-width="2.5"/>
            <line x1="66" y1="20" x2="66" y2="34" stroke="#475569" stroke-width="2.5"/>
            <line x1="86" y1="20" x2="86" y2="34" stroke="#475569" stroke-width="2.5"/>
            <line x1="106" y1="20" x2="106" y2="34" stroke="#475569" stroke-width="2.5"/>
            <circle cx="94" cy="62" r="14" fill="none" stroke="#facc15" stroke-width="4.5"/>
            ${this.wheel(54, 94, 17)}
          `;
        }
        if (vehicle === 'Police Cruiser') {
          return `
            <path d="M0,48 L55,48 L95,60 L95,92 L0,92 Z" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/>
            <path d="M0,48 L28,48 L28,92 L0,92 Z" fill="#f8fafc"/>
            <polygon points="14,56 16.5,62 23,62 18,66 20,72 14,68 8,72 10,66 5,62 11.5,62" fill="#eab308"/>
            <line x1="75" y1="48" x2="85" y2="18" stroke="#94a3b8" stroke-width="2.5"/>
            <circle cx="85" cy="18" r="3" fill="#ef4444"/>
            <rect x="90" y="62" width="6" height="12" rx="2" fill="#ef4444"/>
            ${this.wheel(52, 92, 16)}
          `;
        }
        if (vehicle === 'School Bus') {
          return `
            <rect x="10" y="32" width="110" height="60" rx="4" fill="#d97706" stroke="#92400e" stroke-width="2"/>
            <rect x="10" y="74" width="110" height="6" fill="#18181b"/>
            <rect x="10" y="44" width="110" height="5" fill="#18181b"/>
            <rect x="25" y="48" width="28" height="22" rx="3" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
            <rect x="65" y="48" width="28" height="22" rx="3" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
            ${this.wheel(55, 92, 16)}
          `;
        }
        if (vehicle === 'Monster Truck') {
          return `
            <path d="M0,42 L70,42 L85,62 L85,80 L0,80 Z" fill="#15803d" stroke="#14532d" stroke-width="2.5"/>
            <path d="M30,42 L45,18 L60,18 L68,42" fill="none" stroke="#f8fafc" stroke-width="4"/>
            <circle cx="48" cy="16" r="4.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
            <circle cx="58" cy="16" r="4.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
            <rect x="12" y="24" width="6" height="20" fill="#475569"/>
            <circle cx="15" cy="15" r="5" fill="#e2e8f0" opacity="0.8"/>
            ${this.wheel(54, 88, 22, true)}
          `;
        }
        if (vehicle === 'Race Car') {
          return `
            <path d="M0,60 L55,60 L95,68 L95,90 L0,90 Z" fill="#c2410c" stroke="#7c2d12" stroke-width="2"/>
            <rect x="65" y="38" width="35" height="7" rx="2" fill="#09090b"/>
            <line x1="72" y1="45" x2="72" y2="65" stroke="#09090b" stroke-width="3.5"/>
            <line x1="90" y1="45" x2="90" y2="68" stroke="#09090b" stroke-width="3.5"/>
            <rect x="90" y="76" width="8" height="6" fill="#475569"/>
            <polygon points="98,78 116,75 106,79 118,82 98,81" fill="#facc15"/>
            ${this.wheel(50, 90, 15)}
          `;
        }
        if (vehicle === 'Tow Truck') {
          return `
            <path d="M10,88 L70,22 L85,22 L30,88 Z" fill="#ca8a04" stroke="#713f12" stroke-width="2.5"/>
            <line x1="78" y1="24" x2="96" y2="58" stroke="#334155" stroke-width="3"/>
            <path d="M96,58 C96,68 110,68 110,60 C110,54 102,54 102,58" fill="none" stroke="#eab308" stroke-width="4"/>
            ${this.wheel(55, 92, 16)}
          `;
        }
        return `
          <rect x="35" y="24" width="55" height="68" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
          <circle cx="62" cy="48" r="15" fill="#ef4444" stroke="#f87171" stroke-width="2"/>
          <text x="62" y="80" font-family="'Fredoka One', cursive" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">STOP</text>
        `;
      },

      getFrontHalfSvg(vehicle) {
        if (vehicle === 'Fire Truck') {
          return `
            <path d="M0,36 L65,36 L88,56 L108,56 C112,56 114,60 114,64 L114,92 L0,92 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
            <polygon points="62,40 84,56 42,56 42,40" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
            <rect x="44" y="24" width="16" height="12" rx="3" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
            <circle cx="52" cy="30" r="4" fill="#fecaca"/>
            <rect x="108" y="74" width="10" height="18" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
            <circle cx="102" cy="68" r="7" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
            ${this.wheel(64, 94, 17)}
          `;
        }
        if (vehicle === 'Police Cruiser') {
          return `
            <path d="M0,48 L45,48 L80,62 L108,64 C112,64 114,68 114,72 L114,92 L0,92 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
            <path d="M0,48 L30,48 L30,92 L0,92 Z" fill="#f8fafc"/>
            <polygon points="15,56 17.5,62 24,62 19,66 21,72 15,68 9,72 11,66 6,62 12.5,62" fill="#eab308"/>
            <polygon points="34,50 62,62 22,62" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
            <rect x="16" y="34" width="14" height="12" rx="3" fill="#ef4444"/>
            <rect x="30" y="34" width="14" height="12" rx="3" fill="#3b82f6"/>
            <rect x="108" y="70" width="10" height="18" rx="2" fill="#0f172a"/>
            <circle cx="100" cy="70" r="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
            ${this.wheel(68, 92, 16)}
          `;
        }
        if (vehicle === 'School Bus') {
          return `
            <path d="M0,32 L50,32 L72,48 L106,54 C110,54 114,58 114,64 L114,92 L0,92 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
            <path d="M0,74 L108,74 L108,80 L0,80 Z" fill="#18181b"/>
            <polygon points="44,36 68,48 24,48" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
            <polygon points="14,54 24,54 30,60 30,70 24,76 14,76 8,70 8,60" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
            <text x="19" y="68" font-family="'Fredoka One', cursive" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">STOP</text>
            <rect x="108" y="68" width="6" height="20" fill="#18181b"/>
            <circle cx="100" cy="66" r="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
            ${this.wheel(66, 92, 16)}
          `;
        }
        if (vehicle === 'Monster Truck') {
          return `
            <path d="M0,42 L45,42 L68,56 L108,58 C112,58 114,62 114,68 L114,80 L0,80 Z" fill="#22c55e" stroke="#15803d" stroke-width="2.5"/>
            <path d="M12,68 Q30,60 45,64 Q35,52 25,54 Z" fill="#facc15"/>
            <rect x="74" y="44" width="20" height="15" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
            <circle cx="80" cy="50" r="3" fill="#ef4444"/>
            <circle cx="88" cy="50" r="3" fill="#ef4444"/>
            ${this.wheel(68, 88, 22, true)}
          `;
        }
        if (vehicle === 'Race Car') {
          return `
            <path d="M0,60 L40,60 L75,70 L112,74 C116,74 118,76 118,80 L118,90 L0,90 Z" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
            <polygon points="14,60 42,60 30,50" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
            <circle cx="70" cy="74" r="8.5" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
            <text x="70" y="78.5" font-family="'Fredoka One', cursive" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">1</text>
            <rect x="108" y="86" width="12" height="5" fill="#09090b"/>
            ${this.wheel(68, 90, 15)}
          `;
        }
        if (vehicle === 'Tow Truck') {
          return `
            <path d="M0,36 L60,36 L80,56 L110,58 L110,92 L0,92 Z" fill="#eab308" stroke="#a16207" stroke-width="2"/>
            <polygon points="56,40 76,56 36,56" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
            <rect x="106" y="72" width="10" height="16" fill="#18181b"/>
            ${this.wheel(68, 92, 16)}
          `;
        }
        return `
          <rect x="30" y="24" width="55" height="68" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
          <circle cx="58" cy="48" r="15" fill="#ef4444" stroke="#f87171" stroke-width="2"/>
          <text x="58" y="80" font-family="'Fredoka One', cursive" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">STOP</text>
        `;
      }
    };

    // Full 36 Deck inline
    function getDeck() {
      const vKeys = ["Fire Truck", "Police Cruiser", "School Bus", "Monster Truck", "Race Car"];
      const vColors = { "Fire Truck": "red", "Police Cruiser": "blue", "School Bus": "yellow", "Monster Truck": "green", "Race Car": "orange" };
      const deck = [];
      let id = 1;

      // 5 Pure Matching Cars
      for (let i = 0; i < vKeys.length; i++) {
        const v = vKeys[i];
        deck.push({ id: id++, half1: { vehicle: v, color: vColors[v] }, half2: { vehicle: v, color: vColors[v] } });
      }
      // 27 Franken-Cars
      for (let i = 0; i < vKeys.length; i++) {
        for (let j = 0; j < vKeys.length; j++) {
          if (i !== j && deck.length < 32) {
            deck.push({ id: id++, half1: { vehicle: vKeys[i], color: vColors[vKeys[i]] }, half2: { vehicle: vKeys[j], color: vColors[vKeys[j]] } });
          }
        }
      }
      // 4 Action Cards
      deck.push({ id: id++, half1: { vehicle: "Tow Truck", color: "wild" }, half2: { vehicle: "Police Cruiser", color: "blue" } });
      deck.push({ id: id++, half1: { vehicle: "Tow Truck", color: "wild" }, half2: { vehicle: "Fire Truck", color: "red" } });
      deck.push({ id: id++, half1: { vehicle: "Red Light", color: "red" }, half2: { vehicle: "Race Car", color: "orange" } });
      deck.push({ id: id++, half1: { vehicle: "Red Light", color: "red" }, half2: { vehicle: "School Bus", color: "yellow" } });
      return deck;
    }

    function renderSheets() {
      const cards = getDeck();
      const container = document.getElementById('sheets-container');
      const cardsPerSheet = 8;
      const totalSheets = Math.ceil(cards.length / cardsPerSheet);

      for (let s = 0; s < totalSheets; s++) {
        const sheetCards = cards.slice(s * cardsPerSheet, (s + 1) * cardsPerSheet);
        const sheetEl = document.createElement('div');
        sheetEl.className = 'sheet';

        sheetCards.forEach(c => {
          const cardEl = document.createElement('div');
          cardEl.className = 'card';
          cardEl.innerHTML = CarArtEngine.renderFullCardSvg(c);
          sheetEl.appendChild(cardEl);
        });

        while (sheetEl.children.length < cardsPerSheet) {
          const blank = document.createElement('div');
          blank.className = 'card border-dashed border-slate-300 flex items-center justify-center text-slate-300 font-cartoon text-sm';
          blank.textContent = 'CAR DOMINOES';
          sheetEl.appendChild(blank);
        }

        container.appendChild(sheetEl);
      }
    }

    renderSheets();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Dominoes: Traffic Slam! - Print-and-Play Deck (36 Cards)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');
    
    @page {
      size: letter portrait;
      margin: 0.35in;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    .sheet {
      display: grid;
      grid-template-columns: repeat(3, 2.5in);
      grid-template-rows: repeat(3, 3.5in);
      gap: 0.05in;
      page-break-after: always;
      justify-content: center;
      margin-bottom: 0.5in;
    }

    .card {
      width: 2.5in;
      height: 3.5in;
      box-sizing: border-box;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: white;
      position: relative;
    }

    .font-cartoon {
      font-family: 'Fredoka One', cursive;
    }

    @media print {
      body {
        background: white;
      }
      .no-print {
        display: none !important;
      }
      .sheet {
        margin-bottom: 0;
        gap: 0;
      }
      .card {
        border: 1px solid #94a3b8;
      }
    }
  </style>
</head>
<body class="p-6">

  <!-- TOP PRINT INSTRUCTIONS -->
  <div class="no-print max-w-3xl mx-auto mb-6 p-4 bg-white rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
    <div>
      <h1 class="text-xl font-cartoon text-red-600">CAR DOMINOES: PRINT-AND-PLAY DECK</h1>
      <p class="text-xs text-slate-500 font-bold mt-0.5">36 Cards • 4 Sheets of 9 Poker-Size Cards (2.5" × 3.5") • Ages 5+</p>
    </div>
    <div class="flex gap-2">
      <a href="prototype.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition">
        &larr; Web Prototype
      </a>
      <button onclick="window.print()" class="px-5 py-2 bg-red-600 hover:bg-red-500 text-white font-cartoon text-xs rounded-xl shadow transition">
        🖨️ Print All Sheets (Ctrl+P)
      </button>
    </div>
  </div>

  <div id="sheets-container" class="flex flex-col items-center">
    <!-- Sheets rendered dynamically -->
  </div>

  <script>
    const VEHICLES = {
      "Fire Truck": { color: "red", bg: "bg-red-600", text: "text-white", icon: "🚒" },
      "Police Cruiser": { color: "blue", bg: "bg-blue-600", text: "text-white", icon: "🚓" },
      "School Bus": { color: "yellow", bg: "bg-amber-400", text: "text-slate-950", icon: "🚌" },
      "Monster Truck": { color: "green", bg: "bg-emerald-500", text: "text-slate-950", icon: "🚙" },
      "Race Car": { color: "orange", bg: "bg-orange-500", text: "text-white", icon: "🏎️" },
      "Tow Truck": { color: "wild", bg: "bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500", text: "text-white", icon: "🏗️" },
      "Red Light": { color: "red", bg: "bg-red-600", text: "text-white", icon: "🛑" }
    };

    function getCutSymbol(cut) {
      if (cut === 'edge') return '◄ EDGE';
      if (cut === 'center') return '▲ CENTER';
      return '⤹ 90° TURN';
    }

    async function loadAndRender() {
      const res = await fetch('cards.json');
      const data = await res.json();
      const cards = data.cards;

      const container = document.getElementById('sheets-container');
      const totalSheets = Math.ceil(cards.length / 9);

      for (let s = 0; s < totalSheets; s++) {
        const sheetCards = cards.slice(s * 9, (s + 1) * 9);
        const sheetEl = document.createElement('div');
        sheetEl.className = 'sheet';

        sheetCards.forEach(c => {
          const v1 = VEHICLES[c.half1.vehicle] || VEHICLES["Fire Truck"];
          const v2 = VEHICLES[c.half2.vehicle] || VEHICLES["Fire Truck"];

          const cardEl = document.createElement('div');
          cardEl.className = 'card';

          cardEl.innerHTML = `
            <!-- Top Half -->
            <div class="flex-1 ${v1.bg} ${v1.text} p-2 flex flex-col justify-between border-b-2 border-dashed border-black/30">
              <div class="flex justify-between items-center text-[10px] font-black uppercase tracking-wider">
                <span class="text-base">${v1.icon}</span>
                <span class="bg-black/20 px-1.5 py-0.5 rounded text-[8px]">${getCutSymbol(c.half1.cut)}</span>
              </div>
              <div class="text-center font-cartoon text-sm tracking-wide">${c.half1.part}</div>
              <div class="text-[9px] font-black uppercase tracking-tight text-center truncate">${c.half1.vehicle}</div>
            </div>

            <!-- Bottom Half -->
            <div class="flex-1 ${v2.bg} ${v2.text} p-2 flex flex-col justify-between">
              <div class="flex justify-between items-center text-[10px] font-black uppercase tracking-wider">
                <span class="text-base">${v2.icon}</span>
                <span class="bg-black/20 px-1.5 py-0.5 rounded text-[8px]">${getCutSymbol(c.half2.cut)}</span>
              </div>
              <div class="text-center font-cartoon text-sm tracking-wide">${c.half2.part}</div>
              <div class="text-[9px] font-black uppercase tracking-tight text-center truncate">${c.half2.vehicle}</div>
            </div>

            <!-- Tiny ID Footer -->
            <div class="absolute bottom-0.5 right-1 text-[7px] font-bold opacity-40">#${c.id}</div>
          `;

          sheetEl.appendChild(cardEl);
        });

        // Fill remaining blanks if any
        while (sheetEl.children.length < 9) {
          const blank = document.createElement('div');
          blank.className = 'card border-dashed border-slate-200 flex items-center justify-center text-slate-300 font-cartoon text-xs';
          blank.textContent = 'CAR DOMINOES';
          sheetEl.appendChild(blank);
        }

        container.appendChild(sheetEl);
      }
    }

    loadAndRender();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Dominoes: Traffic Slam! - Print-and-Play Deck (36 Cards)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap');
    
    @page {
      size: letter portrait;
      margin: 0.35in;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    .sheet {
      display: grid;
      grid-template-columns: repeat(3, 2.5in);
      grid-template-rows: repeat(3, 3.5in);
      gap: 0.05in;
      page-break-after: always;
      justify-content: center;
      margin-bottom: 0.5in;
    }

    .card {
      width: 2.5in;
      height: 3.5in;
      box-sizing: border-box;
      border: 1px dashed #94a3b8;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: white;
      position: relative;
    }

    .font-cartoon {
      font-family: 'Fredoka One', cursive;
    }

    @media print {
      body {
        background: white;
      }
      .no-print {
        display: none !important;
      }
      .sheet {
        margin-bottom: 0;
        gap: 0;
      }
      .card {
        border: 1px solid #64748b;
      }
    }
  </style>
</head>
<body class="p-6">

  <!-- TOP PRINT INSTRUCTIONS -->
  <div class="no-print max-w-3xl mx-auto mb-6 p-4 bg-white rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
    <div>
      <h1 class="text-xl font-cartoon text-red-600">CAR DOMINOES: PRINT-AND-PLAY DECK</h1>
      <p class="text-xs text-slate-500 font-bold mt-0.5">36 Cards • 4 Sheets of 9 Poker-Size Cards (2.5" × 3.5") • Illustrated Edition</p>
    </div>
    <div class="flex gap-2">
      <a href="prototype.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition">
        &larr; Web Prototype
      </a>
      <button onclick="window.print()" class="px-5 py-2 bg-red-600 hover:bg-red-500 text-white font-cartoon text-xs rounded-xl shadow transition">
        🖨️ Print All Sheets (Ctrl+P)
      </button>
    </div>
  </div>

  <div id="sheets-container" class="flex flex-col items-center">
    <!-- Rendered Sheets -->
  </div>

  <script>
    const SvgEngine = {
      wheel(cx, cy, r = 16, isMonster = false) {
        if (isMonster) {
          return `
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="#18181b" stroke="#09090b" stroke-width="4"/>
            <circle cx="${cx}" cy="${cy}" r="${r-5}" fill="#27272a" stroke="#71717a" stroke-width="2"/>
            <circle cx="${cx}" cy="${cy}" r="6" fill="#e4e4e7"/>
          `;
        }
        return `
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="#18181b" stroke="#27272a" stroke-width="3"/>
          <circle cx="${cx}" cy="${cy}" r="${r-6}" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
          <circle cx="${cx}" cy="${cy}" r="3" fill="#334155"/>
        `;
      },

      renderHalf(vehicle, part, color, cut) {
        const isRear = part === 'Rear';
        let artSvg = '';

        if (vehicle === 'Fire Truck') {
          if (isRear) {
            artSvg = `
              <rect x="12" y="38" width="88" height="48" rx="4" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
              <rect x="20" y="44" width="40" height="34" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
              <line x1="20" y1="52" x2="60" y2="52" stroke="#64748b" stroke-width="1.5"/>
              <line x1="20" y1="60" x2="60" y2="60" stroke="#64748b" stroke-width="1.5"/>
              <line x1="20" y1="68" x2="60" y2="68" stroke="#64748b" stroke-width="1.5"/>
              <rect x="10" y="24" width="90" height="12" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
              <line x1="22" y1="24" x2="22" y2="36" stroke="#475569" stroke-width="2"/>
              <line x1="38" y1="24" x2="38" y2="36" stroke="#475569" stroke-width="2"/>
              <line x1="54" y1="24" x2="54" y2="36" stroke="#475569" stroke-width="2"/>
              <line x1="70" y1="24" x2="70" y2="36" stroke="#475569" stroke-width="2"/>
              <line x1="86" y1="24" x2="86" y2="36" stroke="#475569" stroke-width="2"/>
              <circle cx="78" cy="60" r="11" fill="none" stroke="#eab308" stroke-width="4"/>
              ${this.wheel(45, 86, 15)}
            `;
          } else {
            artSvg = `
              <path d="M0,38 L55,38 L72,54 L85,54 C88,54 90,56 90,60 L90,86 L0,86 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
              <polygon points="52,42 68,54 36,54 36,42" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
              <rect x="85" y="74" width="10" height="12" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
              <circle cx="82" cy="66" r="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
              <rect x="38" y="28" width="12" height="10" rx="3" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/>
              <circle cx="44" cy="33" r="3" fill="#fecaca"/>
              ${this.wheel(50, 86, 15)}
            `;
          }
        } else if (vehicle === 'Police Cruiser') {
          if (isRear) {
            artSvg = `
              <path d="M0,48 L45,48 L75,58 L75,84 L0,84 Z" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/>
              <path d="M0,48 L22,48 L22,84 L0,84 Z" fill="#f8fafc"/>
              <polygon points="11,54 13,59 18,59 14,62 16,67 11,64 6,67 8,62 4,59 9,59" fill="#eab308"/>
              <line x1="60" y1="48" x2="68" y2="24" stroke="#64748b" stroke-width="2"/>
              <circle cx="68" cy="23" r="2" fill="#ef4444"/>
              <rect x="70" y="60" width="6" height="10" rx="2" fill="#ef4444"/>
              ${this.wheel(40, 84, 14)}
            `;
          } else {
            artSvg = `
              <path d="M0,48 L35,48 L65,60 L85,62 C88,62 90,64 90,68 L90,84 L0,84 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
              <path d="M0,48 L24,48 L24,84 L0,84 Z" fill="#f8fafc"/>
              <polygon points="12,56 14,60 19,60 15,63 17,68 12,65 7,68 9,63 5,60 10,60" fill="#eab308"/>
              <polygon points="26,50 48,60 18,60" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
              <rect x="14" y="38" width="10" height="8" rx="2" fill="#ef4444"/>
              <rect x="24" y="38" width="10" height="8" rx="2" fill="#3b82f6"/>
              <rect x="85" y="68" width="8" height="14" rx="2" fill="#0f172a"/>
              <circle cx="80" cy="68" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
              ${this.wheel(54, 84, 14)}
            `;
          }
        } else if (vehicle === 'School Bus') {
          if (isRear) {
            artSvg = `
              <rect x="10" y="34" width="90" height="52" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
              <rect x="10" y="70" width="90" height="5" fill="#18181b"/>
              <rect x="10" y="44" width="90" height="4" fill="#18181b"/>
              <rect x="22" y="48" width="22" height="18" rx="2" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
              <rect x="54" y="48" width="22" height="18" rx="2" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
              ${this.wheel(45, 86, 14)}
            `;
          } else {
            artSvg = `
              <path d="M0,34 L40,34 L56,48 L84,52 C88,52 90,56 90,62 L90,86 L0,86 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
              <path d="M0,70 L86,70 L86,75 L0,75 Z" fill="#18181b"/>
              <polygon points="34,38 52,48 20,48" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
              <polygon points="12,54 20,54 24,58 24,66 20,70 12,70 8,66 8,58" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
              <text x="16" y="64" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle">STOP</text>
              <rect x="85" y="66" width="6" height="16" fill="#18181b"/>
              <circle cx="80" cy="62" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
              ${this.wheel(52, 86, 14)}
            `;
          }
        } else if (vehicle === 'Monster Truck') {
          if (isRear) {
            artSvg = `
              <path d="M0,42 L55,42 L65,58 L65,72 L0,72 Z" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
              <path d="M22,42 L32,24 L42,24 L48,42" fill="none" stroke="#cbd5e1" stroke-width="3"/>
              <circle cx="34" cy="22" r="3.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
              <circle cx="42" cy="22" r="3.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
              <rect x="10" y="26" width="5" height="18" fill="#475569"/>
              <circle cx="12" cy="18" r="4" fill="#e2e8f0" opacity="0.8"/>
              <line x1="42" y1="70" x2="42" y2="84" stroke="#94a3b8" stroke-width="4"/>
              ${this.wheel(42, 82, 22, true)}
            `;
          } else {
            artSvg = `
              <path d="M0,42 L35,42 L52,54 L84,56 C88,56 90,60 90,66 L90,74 L0,74 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
              <path d="M10,64 Q25,58 35,62 Q28,52 20,54 Z" fill="#facc15"/>
              <rect x="58" y="44" width="16" height="12" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
              <line x1="52" y1="70" x2="52" y2="84" stroke="#94a3b8" stroke-width="4"/>
              ${this.wheel(54, 82, 22, true)}
            `;
          }
        } else if (vehicle === 'Race Car') {
          if (isRear) {
            artSvg = `
              <path d="M0,58 L45,58 L78,66 L78,82 L0,82 Z" fill="#ea580c" stroke="#9a3412" stroke-width="2"/>
              <rect x="52" y="42" width="28" height="5" rx="1.5" fill="#18181b"/>
              <line x1="58" y1="47" x2="58" y2="62" stroke="#18181b" stroke-width="2.5"/>
              <line x1="72" y1="47" x2="72" y2="64" stroke="#18181b" stroke-width="2.5"/>
              <rect x="74" y="74" width="8" height="5" fill="#334155"/>
              <polygon points="82,76 96,74 88,77 98,80 82,79" fill="#facc15"/>
              ${this.wheel(40, 82, 13)}
            `;
          } else {
            artSvg = `
              <path d="M0,58 L32,58 L58,68 L88,72 C92,72 94,74 94,78 L94,82 L0,82 Z" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
              <polygon points="12,58 34,58 24,50" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
              <circle cx="56" cy="71" r="7" fill="#ffffff"/>
              <text x="56" y="74.5" font-size="8" font-weight="900" fill="#0f172a" text-anchor="middle">1</text>
              <rect x="86" y="80" width="10" height="4" fill="#18181b"/>
              ${this.wheel(54, 82, 13)}
            `;
          }
        } else if (vehicle === 'Tow Truck') {
          artSvg = `
            <path d="M10,80 L55,26 L65,26 L22,80 Z" fill="#eab308" stroke="#854d0e" stroke-width="2"/>
            <line x1="60" y1="28" x2="74" y2="54" stroke="#334155" stroke-width="2"/>
            <path d="M74,54 C74,62 84,62 84,56 C84,50 78,50 78,54" fill="none" stroke="#eab308" stroke-width="3"/>
            <rect x="15" y="70" width="40" height="8" fill="#18181b"/>
            ${this.wheel(50, 84, 15)}
          `;
        } else if (vehicle === 'Red Light') {
          artSvg = `
            <rect x="25" y="24" width="50" height="60" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
            <circle cx="50" cy="45" r="14" fill="#ef4444" stroke="#f87171" stroke-width="2"/>
            <rect x="35" y="66" width="30" height="12" rx="3" fill="#dc2626"/>
            <text x="50" y="75" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">STOP</text>
          `;
        }

        return `
          <svg viewBox="0 0 100 110" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
            <rect x="0" y="88" width="100" height="22" fill="#090d16"/>
            <line x1="0" y1="99" x2="100" y2="99" stroke="#eab308" stroke-dasharray="8,6" stroke-width="2"/>
            ${artSvg}
          </svg>
        `;
      }
    };

    function getColorBg(color) {
      if (color === 'wild') return 'bg-gradient-to-tr from-pink-600 via-purple-600 to-indigo-600 text-white';
      if (color === 'red') return 'bg-red-600 text-white';
      if (color === 'blue') return 'bg-blue-600 text-white';
      if (color === 'yellow') return 'bg-amber-400 text-slate-950';
      if (color === 'green') return 'bg-emerald-600 text-white';
      if (color === 'orange') return 'bg-orange-600 text-white';
      return 'bg-slate-700 text-white';
    }

    async function loadAndRender() {
      const res = await fetch('cards.json');
      const data = await res.json();
      const cards = data.cards;

      const container = document.getElementById('sheets-container');
      const totalSheets = Math.ceil(cards.length / 9);

      for (let s = 0; s < totalSheets; s++) {
        const sheetCards = cards.slice(s * 9, (s + 1) * 9);
        const sheetEl = document.createElement('div');
        sheetEl.className = 'sheet';

        sheetCards.forEach(c => {
          const cardEl = document.createElement('div');
          cardEl.className = 'card';

          cardEl.innerHTML = `
            <!-- Top Half (Left Half) -->
            <div class="flex-1 ${getColorBg(c.half1.color)} p-1 relative flex flex-col justify-between border-b-2 border-dashed border-black/30">
              <div class="flex justify-between items-center text-[9px] font-black uppercase tracking-wider">
                <span>${c.half1.part}</span>
                <span class="bg-black/20 px-1 py-0.5 rounded text-[7px]">${c.half1.color}</span>
              </div>
              <div class="w-full h-24">
                ${SvgEngine.renderHalf(c.half1.vehicle, c.half1.part, c.half1.color, c.half1.cut)}
              </div>
              <div class="text-[8px] font-black uppercase tracking-tight text-center truncate">${c.half1.vehicle}</div>
            </div>

            <!-- Bottom Half (Right Half) -->
            <div class="flex-1 ${getColorBg(c.half2.color)} p-1 relative flex flex-col justify-between">
              <div class="flex justify-between items-center text-[9px] font-black uppercase tracking-wider">
                <span>${c.half2.part}</span>
                <span class="bg-black/20 px-1 py-0.5 rounded text-[7px]">${c.half2.color}</span>
              </div>
              <div class="w-full h-24">
                ${SvgEngine.renderHalf(c.half2.vehicle, c.half2.part, c.half2.color, c.half2.cut)}
              </div>
              <div class="text-[8px] font-black uppercase tracking-tight text-center truncate">${c.half2.vehicle}</div>
            </div>

            <div class="absolute bottom-0.5 right-1 text-[7px] font-bold opacity-40">#${c.id}</div>
          `;

          sheetEl.appendChild(cardEl);
        });

        while (sheetEl.children.length < 9) {
          const blank = document.createElement('div');
          blank.className = 'card border-dashed border-slate-200 flex items-center justify-center text-slate-300 font-cartoon text-xs';
          blank.textContent = 'CAR DOMINOES';
          sheetEl.appendChild(blank);
        }

        container.appendChild(sheetEl);
      }
    }

    loadAndRender();
  </script>
</body>
</html>
